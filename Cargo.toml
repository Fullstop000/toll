[package]
name = "toll"
version = "1.0.3"
edition = "2024"
description = "Token usage statistics for Claude Code and Codex CLI"
license = "MIT"
repository = "https://github.com/Fullstop000/toll"
keywords = ["claude", "codex", "tokens", "usage", "ai"]
categories = ["command-line-utilities"]

[[bin]]
name = "toll"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[profile.release]
opt-level = 3
strip = true

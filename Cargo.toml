[package]
name = "toll"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "toll"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[profile.release]
opt-level = 3
strip = true
